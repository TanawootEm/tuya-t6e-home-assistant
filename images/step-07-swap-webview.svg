<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" font-family="Arial, Helvetica, sans-serif">
  <title>Safe WebView swap sequence</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#374151"/></marker></defs>
  <rect width="860" height="390" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 7: Copy, verify, then rename</text>
  <g font-size="14" text-anchor="middle">
    <rect x="25" y="75" width="150" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="100" y="110" font-size="15" font-weight="700" fill="#1e3a8a">1. Remount</text>
    <text x="100" y="138" fill="#1e3a8a">/system</text>
    <text x="100" y="158" fill="#1e3a8a">read-write</text>
    <rect x="195" y="75" width="150" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="270" y="110" font-size="15" font-weight="700" fill="#1e3a8a">2. Copy</text>
    <text x="270" y="138" fill="#1e3a8a">webview.apk.new</text>
    <text x="270" y="158" fill="#1e3a8a">Old file stays</text>
    <rect x="365" y="75" width="150" height="110" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="440" y="110" font-size="15" font-weight="700" fill="#78350f">3. Verify</text>
    <text x="440" y="138" fill="#78350f">SHA-256, owner,</text>
    <text x="440" y="158" fill="#78350f">mode, SELinux</text>
    <rect x="535" y="75" width="150" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="610" y="110" font-size="15" font-weight="700" fill="#1e3a8a">4. Rename</text>
    <text x="610" y="138" fill="#1e3a8a">Over webview.apk</text>
    <text x="610" y="158" fill="#1e3a8a">Remove oat/</text>
    <rect x="705" y="75" width="130" height="110" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="770" y="110" font-size="15" font-weight="700" fill="#14532d">5. Reboot</text>
    <text x="770" y="138" fill="#14532d">Check current</text>
    <text x="770" y="158" fill="#14532d">WebView</text>
  </g>
  <path d="M175 130 H193" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M345 130 H363" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M515 130 H533" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M685 130 H703" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="25" y="215" width="395" height="145" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="222" y="247" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Why Xposed wasn't needed</text>
  <text x="222" y="277" font-size="14" fill="#14532d" text-anchor="middle">Both use package com.android.webview</text>
  <text x="222" y="303" font-size="14" fill="#14532d" text-anchor="middle">Replace one APK under /system</text>
  <text x="222" y="329" font-size="14" fill="#14532d" text-anchor="middle">Core runtime files stay unchanged</text>
  <rect x="440" y="215" width="395" height="145" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="637" y="247" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="middle">Don't delete the old APK first</text>
  <text x="637" y="277" font-size="14" fill="#7f1d1d" text-anchor="middle">Running apps keep the deleted file open</text>
  <text x="637" y="303" font-size="14" fill="#7f1d1d" text-anchor="middle">Its space isn't released yet</text>
  <text x="637" y="329" font-size="14" fill="#7f1d1d" text-anchor="middle">Copy failed: No space left on device</text>
</svg>
