<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Enable persistent ADB over TCP</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#374151"/></marker></defs>
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 3: Move ADB from USB to Wi-Fi</text>
  <g font-size="14" text-anchor="middle">
    <rect x="25" y="85" width="185" height="130" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="117" y="118" font-size="16" font-weight="700" fill="#1e3a8a">1. Save the port</text>
    <text x="117" y="150" fill="#1e3a8a">setprop</text>
    <text x="117" y="170" fill="#1e3a8a">persist.adb.tcp.port</text>
    <text x="117" y="190" fill="#1e3a8a">5555</text>
    <rect x="235" y="85" width="170" height="130" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="320" y="118" font-size="16" font-weight="700" fill="#1e3a8a">2. Switch now</text>
    <text x="320" y="160" fill="#1e3a8a">adb tcpip 5555</text>
    <rect x="430" y="85" width="190" height="130" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="525" y="118" font-size="16" font-weight="700" fill="#1e3a8a">3. Connect</text>
    <text x="525" y="160" fill="#1e3a8a">adb connect</text>
    <text x="525" y="180" fill="#1e3a8a">&lt;PANEL_IP&gt;:5555</text>
    <rect x="645" y="85" width="190" height="130" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="740" y="118" font-size="16" font-weight="700" fill="#14532d">4. Reboot to verify</text>
    <text x="740" y="155" fill="#14532d">Port returned by itself</text>
    <text x="740" y="175" fill="#14532d">in about 30 s</text>
  </g>
  <path d="M210 150 H233" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M405 150 H428" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M620 150 H643" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="430" y="262" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="700">Anyone on this network can now get a root shell. See Security warnings.</text>
</svg>
