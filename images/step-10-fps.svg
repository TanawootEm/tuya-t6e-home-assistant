<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="Arial, Helvetica, sans-serif">
  <title>FPS while swiping at normal and maximum clocks</title>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 10: Faster clocks barely changed FPS</text>
  <text x="30" y="66" font-size="15" fill="#4b5563">SurfaceFlinger page flips during continuous swipes, two runs each. Display: 60 Hz.</text>
  <path d="M70 360 H830" stroke="#374151" stroke-width="2"/>
  <path d="M70 360 V90" stroke="#374151" stroke-width="2"/>
  <g font-size="13" fill="#4b5563" text-anchor="end">
    <text x="62" y="365">0</text><text x="62" y="245">4</text><text x="62" y="125">8</text>
  </g>
  <path d="M70 240 H830 M70 120 H830" stroke="#d1d5db" stroke-width="1"/>
  <text x="24" y="225" font-size="13" fill="#4b5563" transform="rotate(-90 24 225)" text-anchor="middle">FPS</text>
  <g fill="#6b7280">
    <rect x="95" y="129" width="55" height="231"/><rect x="155" y="120" width="55" height="240"/>
    <rect x="645" y="108" width="55" height="252"/><rect x="705" y="108" width="55" height="252"/>
  </g>
  <rect x="280" y="105" width="55" height="255" fill="#2563eb"/><rect x="340" y="108" width="55" height="252" fill="#2563eb"/>
  <rect x="465" y="90" width="55" height="270" fill="#15803d"/><rect x="525" y="105" width="55" height="255" fill="#15803d"/>
  <g font-size="14" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="122" y="123">7.7</text><text x="182" y="114">8.0</text>
    <text x="307" y="99">8.5</text><text x="367" y="102">8.4</text>
    <text x="492" y="84">9.0</text><text x="552" y="99">8.5</text>
    <text x="672" y="102">8.4</text><text x="732" y="102">8.4</text>
  </g>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <text x="152" y="383" font-weight="700">Normal</text><text x="152" y="403">GPU 200 MHz</text>
    <text x="337" y="383" font-weight="700">GPU max</text><text x="337" y="403">480 MHz</text>
    <text x="522" y="383" font-weight="700">GPU + RAM max</text><text x="522" y="403">480 + 666 MHz</text>
    <text x="702" y="383" font-weight="700">Normal again</text><text x="702" y="403">GPU 200 MHz</text>
  </g>
  <text x="430" y="442" font-size="15" fill="#374151" text-anchor="middle">GPU load often fell to about 10% at 480 MHz, so its clock doesn't look like the main limit.</text>
</svg>
