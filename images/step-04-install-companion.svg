<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Install the minimal Companion build</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#374151"/></marker></defs>
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 4: Choose the minimal build</text>
  <rect x="30" y="85" width="200" height="130" rx="10" fill="#f3f4f6" stroke="#374151"/>
  <text x="130" y="125" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Panel check</text>
  <text x="130" y="155" font-size="14" fill="#374151" text-anchor="middle">arm64 Android 8.1</text>
  <text x="130" y="178" font-size="14" fill="#374151" text-anchor="middle">No Play Services</text>
  <path d="M230 150 H268" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="273" y="85" width="240" height="130" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="393" y="125" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Official GitHub release</text>
  <text x="393" y="155" font-size="14" fill="#1e3a8a" text-anchor="middle">app-minimal-release.apk</text>
  <text x="393" y="178" font-size="14" fill="#1e3a8a" text-anchor="middle">Compare SHA-256</text>
  <path d="M513 150 H551" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="556" y="85" width="274" height="130" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="693" y="125" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Install over ADB</text>
  <text x="693" y="155" font-size="14" fill="#14532d" text-anchor="middle">adb install --no-streaming</text>
  <text x="693" y="178" font-size="14" fill="#14532d" text-anchor="middle">Use version 2025.11.4</text>
  <text x="430" y="260" font-size="15" fill="#374151" text-anchor="middle">Step 8 explains why the latest version isn't used here.</text>
</svg>
