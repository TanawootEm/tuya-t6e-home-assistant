<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="Arial, Helvetica, sans-serif">
  <title>Verified system backup</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#374151"/></marker></defs>
  <rect width="860" height="340" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 6: Check the size, not only the hash</text>
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="75" width="180" height="85" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="120" y="110" font-size="16" font-weight="700" fill="#1e3a8a">Image partition</text>
    <text x="120" y="135" fill="#1e3a8a">dd to /data</text>
    <rect x="240" y="75" width="180" height="85" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="330" y="110" font-size="16" font-weight="700" fill="#78350f">Compare size</text>
    <text x="330" y="135" fill="#78350f">Image = partition?</text>
    <rect x="450" y="75" width="180" height="85" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="540" y="110" font-size="16" font-weight="700" fill="#1e3a8a">Compress, pull</text>
    <text x="540" y="135" fill="#1e3a8a">Copy to PC</text>
    <rect x="660" y="75" width="170" height="85" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="745" y="110" font-size="16" font-weight="700" fill="#14532d">Compare hash</text>
    <text x="745" y="135" fill="#14532d">Panel = PC?</text>
  </g>
  <path d="M210 118 H238" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M420 118 H448" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M630 118 H658" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="30" y="195" width="385" height="115" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="222" y="228" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="middle">Failed attempt</text>
  <text x="222" y="256" font-size="15" fill="#7f1d1d" text-anchor="middle">20-byte .gz file</text>
  <text x="222" y="282" font-size="14" fill="#7f1d1d" text-anchor="middle">Hashes matched, but the backup was empty</text>
  <rect x="445" y="195" width="385" height="115" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="637" y="228" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Verified backup</text>
  <text x="637" y="256" font-size="15" fill="#14532d" text-anchor="middle">1,610,612,736 bytes</text>
  <text x="637" y="282" font-size="14" fill="#14532d" text-anchor="middle">About 588 MB compressed</text>
</svg>
