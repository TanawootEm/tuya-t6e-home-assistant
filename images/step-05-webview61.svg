<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="Arial, Helvetica, sans-serif">
  <title>Why WebView 61 fails</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#374151"/></marker></defs>
  <rect width="860" height="340" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 5: "Connection timed out" is misleading</text>
  <rect x="30" y="80" width="190" height="210" rx="10" fill="#f3f4f6" stroke="#374151"/>
  <text x="125" y="115" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Companion app</text>
  <rect x="640" y="80" width="190" height="210" rx="10" fill="#f3f4f6" stroke="#374151"/>
  <text x="735" y="115" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Home Assistant</text>
  <path d="M220 145 H638" stroke="#15803d" stroke-width="3" marker-end="url(#a)"/>
  <rect x="285" y="128" width="290" height="34" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="430" y="151" font-size="14" fill="#14532d" text-anchor="middle" font-weight="700">Network and WebSocket: working</text>
  <path d="M638 215 H220" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <rect x="285" y="198" width="290" height="34" rx="6" fill="#f9fafb" stroke="#374151"/>
  <text x="430" y="221" font-size="14" fill="#111827" text-anchor="middle">Frontend JavaScript delivered</text>
  <rect x="48" y="180" width="154" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="125" y="207" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">WebView 61</text>
  <text x="125" y="229" font-size="13" fill="#7f1d1d" text-anchor="middle">Uncaught SyntaxError</text>
  <text x="125" y="250" font-size="13" fill="#7f1d1d" text-anchor="middle">ExternalBusTimeout</text>
  <text x="430" y="322" font-size="15" fill="#374151" text-anchor="middle">The app can reach the server, but the old WebView can't run the page.</text>
</svg>
