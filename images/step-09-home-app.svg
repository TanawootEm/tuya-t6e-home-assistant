<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" font-family="Arial, Helvetica, sans-serif">
  <title>Make Companion the Home app</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#374151"/></marker></defs>
  <rect width="860" height="310" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 9: Set Home, wait, then reboot</text>
  <g font-size="14" text-anchor="middle">
    <rect x="25" y="80" width="185" height="125" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="117" y="113" font-size="15" font-weight="700" fill="#7f1d1d">1. Disable Tuya</text>
    <text x="117" y="143" fill="#7f1d1d">Launcher and app</text>
    <text x="117" y="165" fill="#7f1d1d">pm disable-user</text>
    <rect x="235" y="80" width="185" height="125" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="327" y="113" font-size="15" font-weight="700" fill="#1e3a8a">2. Enable alias</text>
    <text x="327" y="143" fill="#1e3a8a">LauncherAlias</text>
    <text x="327" y="165" fill="#1e3a8a">set-home-activity</text>
    <rect x="445" y="80" width="175" height="125" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="532" y="113" font-size="15" font-weight="700" fill="#78350f">3. Wait 30 s</text>
    <text x="532" y="143" fill="#78350f">Then run sync</text>
    <text x="532" y="165" fill="#78350f">Don't rush this</text>
    <rect x="645" y="80" width="190" height="125" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="740" y="113" font-size="15" font-weight="700" fill="#14532d">4. Reboot, verify</text>
    <text x="740" y="143" fill="#14532d">Companion on screen</text>
    <text x="740" y="165" fill="#14532d">Wi-Fi and ADB back</text>
  </g>
  <path d="M210 142 H233" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M420 142 H443" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M620 142 H643" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="430" y="255" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="700">Tuya features may stop working, and weren't tested afterwards.</text>
  <text x="430" y="282" font-size="14" fill="#374151" text-anchor="middle">scripts/Restore-Tuya.ps1 reverses this step.</text>
</svg>
