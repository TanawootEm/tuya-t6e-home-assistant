<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="Arial, Helvetica, sans-serif">
  <title>Schematic of the T6E mainboard</title>
  <rect width="820" height="500" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 1: Find the ports on the mainboard</text>
  <text x="30" y="66" font-size="15" fill="#4b5563">Schematic only, not to scale. ST-PX30-T6E-V1.0</text>
  <rect x="190" y="95" width="440" height="340" rx="12" fill="#14532d" stroke="#052e16" stroke-width="3"/>
  <rect x="340" y="205" width="120" height="120" rx="6" fill="#111827"/>
  <text x="400" y="260" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">PX30</text>
  <text x="400" y="284" font-size="13" fill="#d1d5db" text-anchor="middle">Rockchip SoC</text>
  <g fill="#fbbf24"><circle cx="225" cy="130" r="8"/><circle cx="255" cy="130" r="8"/><circle cx="285" cy="130" r="8"/><circle cx="315" cy="130" r="8"/></g>
  <text x="270" y="160" font-size="13" fill="#ffffff" text-anchor="middle">GND RX TX VCC</text>
  <rect x="520" y="345" width="62" height="42" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="551" y="372" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">BOOT</text>
  <rect x="365" y="405" width="70" height="30" rx="4" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <text x="400" y="425" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">OTG</text>
  <path d="M190 130 H145" stroke="#1f2937" stroke-width="2"/>
  <text x="20" y="118" font-size="15" font-weight="700" fill="#1f2937">UART pads</text>
  <text x="20" y="138" font-size="13" fill="#4b5563">Fallback, not needed</text>
  <path d="M582 366 H650" stroke="#1f2937" stroke-width="2"/>
  <text x="656" y="360" font-size="15" font-weight="700" fill="#1f2937">BOOT button</text>
  <text x="656" y="380" font-size="13" fill="#4b5563">Hold at power-up for</text>
  <text x="656" y="397" font-size="13" fill="#4b5563">Android Recovery</text>
  <path d="M435 420 H650" stroke="#1f2937" stroke-width="2"/>
  <text x="656" y="418" font-size="15" font-weight="700" fill="#1f2937">Micro-USB OTG</text>
  <text x="656" y="438" font-size="13" fill="#4b5563">Connect for ADB</text>
  <rect x="30" y="455" width="760" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="410" y="478" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="700">Mains danger: disconnect the 100–240 V power base before working on the board</text>
</svg>
