<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="Arial, Helvetica, sans-serif">
  <title>Testing USB cable and port pairs</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#374151"/></marker></defs>
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">Step 2: Power is not proof of a data link</text>
  <rect x="30" y="75" width="185" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="122" y="110" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Try one pair</text>
  <text x="122" y="134" font-size="14" fill="#1e3a8a" text-anchor="middle">Cable + PC port</text>
  <text x="122" y="153" font-size="14" fill="#1e3a8a" text-anchor="middle">Wait about 60 s</text>
  <path d="M215 120 H265" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="270" y="75" width="185" height="90" rx="10" fill="#f3f4f6" stroke="#374151"/>
  <text x="362" y="113" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Panel screen on?</text>
  <text x="362" y="139" font-size="14" fill="#374151" text-anchor="middle">Yes on every attempt</text>
  <path d="M455 120 H505" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="510" y="75" width="320" height="90" rx="10" fill="#f3f4f6" stroke="#374151"/>
  <text x="670" y="113" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">adb devices -l</text>
  <text x="670" y="139" font-size="14" fill="#374151" text-anchor="middle">The test that matters</text>
  <path d="M600 165 L490 225" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M740 165 L740 225" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="270" y="230" width="280" height="95" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="410" y="264" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="middle">Empty list</text>
  <text x="410" y="288" font-size="14" fill="#7f1d1d" text-anchor="middle">Check PnP history</text>
  <text x="410" y="308" font-size="14" fill="#7f1d1d" text-anchor="middle">Then try the next pair</text>
  <rect x="595" y="230" width="235" height="95" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="712" y="264" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">ADB device listed</text>
  <text x="712" y="288" font-size="14" fill="#14532d" text-anchor="middle">Go straight to Step 3</text>
  <text x="712" y="308" font-size="14" fill="#14532d" text-anchor="middle">USB may keep dropping</text>
  <path d="M270 277 H122 V170" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <rect x="30" y="350" width="800" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="50" y="375" font-size="14" font-weight="700" fill="#111827">Windows evidence of a past success:</text>
  <text x="50" y="397" font-size="14" fill="#374151">VID_2207&amp;PID_0006, class FF/42/01, Kernel-PnP events 400 and 410</text>
</svg>
